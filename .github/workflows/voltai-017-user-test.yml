name: Build VoltAI 0.17 User Test

on:
  push:
    branches:
      - voltai-017-user-test
    paths:
      - 'voltai-build/volt17_*'
      - '.github/workflows/voltai-017-user-test.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore VoltAI 0.17 source
        shell: bash
        run: |
          set -euo pipefail
          cat voltai-build/volt17_* > voltai-build/VoltAI_0_17_source.b64
          base64 -d voltai-build/VoltAI_0_17_source.b64 > voltai-build/VoltAI_0_17_source.tar.xz
          echo "e6c1664551d6893baabe386e40d77541d6f32800ec9cbb9fffe5189a3cfa979d  voltai-build/VoltAI_0_17_source.tar.xz" | sha256sum -c -
          mkdir -p voltai-build/src
          tar -xJf voltai-build/VoltAI_0_17_source.tar.xz -C voltai-build/src

      - name: Preflight user test
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionCode 45" voltai-build/src/app/build.gradle
          grep -q "0.17.0-voltai-user-test-universal" voltai-build/src/app/build.gradle
          grep -q "<string name=\"app_name\">VoltAI</string>" voltai-build/src/app/src/main/res/values/strings.xml
          grep -q "LAYER_TYPE_HARDWARE" voltai-build/src/app/src/main/java/com/bateriaia/app/MovaDashboardView.java
          grep -q "CHECK_MS = 30L" voltai-build/src/app/src/main/java/com/bateriaia/app/InternetKnowledgeService.java
          ! grep -R "~" -n voltai-build/src/app/src/main/java voltai-build/src/app/src/main/res/layout voltai-build/src/app/src/main/res/values

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build release APK
        working-directory: voltai-build/src
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify unsigned release
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find voltai-build/src/app/build/outputs/apk/release -name '*.apk' -print -quit)
          test -n "$APK"
          cp "$APK" voltai-build/VoltAI_0_17_USER_TEST_unsigned.apk
          unzip -t voltai-build/VoltAI_0_17_USER_TEST_unsigned.apk >/dev/null
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          "$AAPT" dump badging voltai-build/VoltAI_0_17_USER_TEST_unsigned.apk | tee voltai-build/badging.txt
          grep -q "package: name='com.bateriaia.app' versionCode='45'" voltai-build/badging.txt
          test -f voltai-build/src/app/build/outputs/mapping/release/mapping.txt
          sha256sum voltai-build/VoltAI_0_17_USER_TEST_unsigned.apk > voltai-build/VoltAI_0_17_USER_TEST_unsigned.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: voltai-0-17-user-test
          path: |
            voltai-build/VoltAI_0_17_USER_TEST_unsigned.apk
            voltai-build/VoltAI_0_17_USER_TEST_unsigned.apk.sha256
            voltai-build/badging.txt
            voltai-build/src/app/build/outputs/mapping/release/mapping.txt
            /usr/local/lib/android/sdk/build-tools/36.0.0/zipalign
            /usr/local/lib/android/sdk/build-tools/36.0.0/apksigner
            /usr/local/lib/android/sdk/build-tools/36.0.0/lib/apksigner.jar
          if-no-files-found: error
