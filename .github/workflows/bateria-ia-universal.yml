name: Build Bateria IA Universal 0.2.5

on:
  push:
    branches:
      - bateria-ia-universal025
    paths:
      - 'bateria-v25-patch/**'
      - '.github/workflows/bateria-ia-universal.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore complete source
        shell: bash
        run: |
          cat bateria-build/part_* > bateria-build/source.zip.b64
          base64 -d bateria-build/source.zip.b64 > bateria-build/BateriaIA_beta01_source.zip
          echo "ad2ec69afae4d320e849a5249f60f34f1a97733a3aaa0dd8157cbf83841ae52e  bateria-build/BateriaIA_beta01_source.zip" | sha256sum -c -
          rm -rf bateria-build/source
          mkdir -p bateria-build/source
          unzip -q bateria-build/BateriaIA_beta01_source.zip -d bateria-build/source

      - name: Apply Beta02 core AI
        shell: bash
        run: |
          cat bateria-v2-patch/part_* > bateria-v2-patch/patch.zip.b64
          base64 -d bateria-v2-patch/patch.zip.b64 > bateria-v2-patch/BateriaIA_beta02_patch.zip
          echo "99e7d5138d912b695bfc1d15f2c667e7da411a37d89035b80371072c6ea28dd1  bateria-v2-patch/BateriaIA_beta02_patch.zip" | sha256sum -c -
          unzip -oq bateria-v2-patch/BateriaIA_beta02_patch.zip -d bateria-build/source/BateriaIA_beta01

      - name: Apply Beta02.1 system bar fix
        shell: bash
        run: |
          cat bateria-v2-fix/part_* > bateria-v2-fix/fix.zip.b64
          base64 -d bateria-v2-fix/fix.zip.b64 > bateria-v2-fix/BateriaIA_beta02_1_patch.zip
          echo "3434f6a6c8da429c523d3863728b6e3b7ab9e66867537d8861c1c08cb942b8b3  bateria-v2-fix/BateriaIA_beta02_1_patch.zip" | sha256sum -c -
          unzip -oq bateria-v2-fix/BateriaIA_beta02_1_patch.zip -d bateria-build/source/BateriaIA_beta01
          cp -rf bateria-build/source/BateriaIA_beta01/BateriaIA_beta02_1_patch/app/* bateria-build/source/BateriaIA_beta01/app/

      - name: Apply Beta02.2 intelligence
        shell: bash
        run: |
          cat bateria-v22-patch/part_* > bateria-v22-patch/patch.zip.b64
          base64 -d bateria-v22-patch/patch.zip.b64 > bateria-v22-patch/BateriaIA_beta02_2_patch.zip
          echo "8169f36dddb5b293e9232e432a9b77cdb5bea554d4c8fbdc746e8462d3179077  bateria-v22-patch/BateriaIA_beta02_2_patch.zip" | sha256sum -c -
          rm -rf bateria-v22-patch/extracted
          mkdir -p bateria-v22-patch/extracted
          unzip -q bateria-v22-patch/BateriaIA_beta02_2_patch.zip -d bateria-v22-patch/extracted
          cp -rf bateria-v22-patch/extracted/BateriaIA_beta02_2_patch/app/* bateria-build/source/BateriaIA_beta01/app/

      - name: Apply Beta02.3 MOVA identity
        shell: bash
        run: |
          python3 bateria-v23-patch/apply.py

      - name: Apply Universal 0.2.4 privacy and compatibility
        shell: bash
        run: |
          python3 bateria-v24-universal/apply.py

      - name: Apply Universal 0.2.5 adaptive action pilot
        shell: bash
        run: |
          cat bateria-v25-patch/part_* > bateria-v25-patch/patch.zip.b64
          base64 -d bateria-v25-patch/patch.zip.b64 > bateria-v25-patch/BateriaIA_v025_patch.zip
          printf '\0' >> bateria-v25-patch/BateriaIA_v025_patch.zip
          echo "a183f7b38e68a26998a45b467859aa55c44bb178910b6fa8569481f8569fb8f8  bateria-v25-patch/BateriaIA_v025_patch.zip" | sha256sum -c -
          unzip -oq bateria-v25-patch/BateriaIA_v025_patch.zip -d bateria-build/source/BateriaIA_beta01
          grep -q "minSdk 29" bateria-build/source/BateriaIA_beta01/app/build.gradle
          grep -q "versionCode 7" bateria-build/source/BateriaIA_beta01/app/build.gradle
          grep -q "0.2.5-universal" bateria-build/source/BateriaIA_beta01/app/build.gradle
          grep -q "minifyEnabled true" bateria-build/source/BateriaIA_beta01/app/build.gradle
          grep -q 'allowBackup="false"' bateria-build/source/BateriaIA_beta01/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.WRITE_SETTINGS' bateria-build/source/BateriaIA_beta01/app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.INTERNET' bateria-build/source/BateriaIA_beta01/app/src/main/AndroidManifest.xml
          grep -q 'PILOTO IA' bateria-build/source/BateriaIA_beta01/app/src/main/res/layout/activity_main.xml
          grep -q 'DeviceActionAdvisor' bateria-build/source/BateriaIA_beta01/app/src/main/java/com/bateriaia/app/MainActivity.java
          grep -q 'MOVA Tecnologia e Mobilidade Ltda.' bateria-build/source/BateriaIA_beta01/app/src/main/java/com/bateriaia/app/MainActivity.java

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build complete obfuscated release APK
        working-directory: bateria-build/source/BateriaIA_beta01
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: gradle :app:assembleRelease --stacktrace

      - name: Validate complete APK and compatibility
        shell: bash
        run: |
          APK=$(find bateria-build/source/BateriaIA_beta01/app/build/outputs/apk/release -name '*unsigned*.apk' -print -quit)
          test -n "$APK"
          cp "$APK" bateria-build/BateriaIA_Universal_0.2.5-unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" bateria-build/apksigner.jar
          unzip -t bateria-build/BateriaIA_Universal_0.2.5-unsigned.apk >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging bateria-build/BateriaIA_Universal_0.2.5-unsigned.apk | tee bateria-build/badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions bateria-build/BateriaIA_Universal_0.2.5-unsigned.apk | tee bateria-build/permissions.txt
          grep -q "sdkVersion:'29'" bateria-build/badging.txt
          grep -q "versionCode='7'" bateria-build/badging.txt
          grep -q "versionName='0.2.5-universal'" bateria-build/badging.txt
          grep -q 'android.permission.WRITE_SETTINGS' bateria-build/permissions.txt
          ! grep -q 'android.permission.INTERNET' bateria-build/permissions.txt
          test -s bateria-build/source/BateriaIA_beta01/app/build/outputs/mapping/release/mapping.txt
          cp bateria-build/source/BateriaIA_beta01/app/build/outputs/mapping/release/mapping.txt bateria-build/mapping-release.txt
          ls -lh bateria-build/BateriaIA_Universal_0.2.5-unsigned.apk bateria-build/mapping-release.txt

      - uses: actions/upload-artifact@v4
        with:
          name: BateriaIA-Universal-0.2.5-UNSIGNED
          path: |
            bateria-build/BateriaIA_Universal_0.2.5-unsigned.apk
            bateria-build/apksigner.jar
            bateria-build/badging.txt
            bateria-build/permissions.txt
            bateria-build/mapping-release.txt
          if-no-files-found: error
