name: Build Bateria IA Beta02 APK

on:
  push:
    branches:
      - bateria-ia-beta02
    paths:
      - 'bateria-v2-patch/**'
      - '.github/workflows/bateria-ia-beta02.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore Beta01 source
        shell: bash
        run: |
          cat bateria-build/part_* > bateria-build/source.zip.b64
          base64 -d bateria-build/source.zip.b64 > bateria-build/BateriaIA_beta01_source.zip
          echo "ad2ec69afae4d320e849a5249f60f34f1a97733a3aaa0dd8157cbf83841ae52e  bateria-build/BateriaIA_beta01_source.zip" | sha256sum -c -
          mkdir -p bateria-build/source
          unzip -q bateria-build/BateriaIA_beta01_source.zip -d bateria-build/source

      - name: Apply Beta02 patch
        shell: bash
        run: |
          cat bateria-v2-patch/part_* > bateria-v2-patch/patch.zip.b64
          base64 -d bateria-v2-patch/patch.zip.b64 > bateria-v2-patch/BateriaIA_beta02_patch.zip
          echo "99e7d5138d912b695bfc1d15f2c667e7da411a37d89035b80371072c6ea28dd1  bateria-v2-patch/BateriaIA_beta02_patch.zip" | sha256sum -c -
          unzip -oq bateria-v2-patch/BateriaIA_beta02_patch.zip -d bateria-build/source/BateriaIA_beta01

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Beta02 debug APK
        working-directory: bateria-build/source/BateriaIA_beta01
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK=$(find bateria-build/source/BateriaIA_beta01/app/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -n "$APK"
          cp "$APK" bateria-build/BateriaIA_beta02.apk
          sha256sum bateria-build/BateriaIA_beta02.apk > bateria-build/BateriaIA_beta02.apk.sha256
          unzip -t bateria-build/BateriaIA_beta02.apk >/dev/null
          ls -lh bateria-build/BateriaIA_beta02.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BateriaIA-beta02-APK
          path: |
            bateria-build/BateriaIA_beta02.apk
            bateria-build/BateriaIA_beta02.apk.sha256
          if-no-files-found: error
