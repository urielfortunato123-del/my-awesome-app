name: Build VoltAI 0.18 Orbital User Test

on:
  push:
    branches:
      - voltai-018-orbital-user-test
    paths:
      - 'voltai-build/volt18_*'
      - '.github/workflows/voltai-018-orbital-user-test.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore VoltAI 0.18 source
        shell: bash
        run: |
          set -euo pipefail
          cat voltai-build/volt18_* > voltai-build/VoltAI_0_18_source.b64
          base64 -d voltai-build/VoltAI_0_18_source.b64 > voltai-build/VoltAI_0_18_source.tar.xz
          echo "89b459179f2bd802017f13581f2fbe435e3072a2106d2a31c47bb923774c78db  voltai-build/VoltAI_0_18_source.tar.xz" | sha256sum -c -
          mkdir -p voltai-build/src018
          tar -xJf voltai-build/VoltAI_0_18_source.tar.xz -C voltai-build/src018

      - name: Preflight orbital UI
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionCode 46" voltai-build/src018/app/build.gradle
          grep -q "0.18.0-voltai-mova-orbital-user-test-universal" voltai-build/src018/app/build.gradle
          test -f voltai-build/src018/app/src/main/java/com/bateriaia/app/VoltAiMarkView.java
          grep -q "drawOrbitalHero" voltai-build/src018/app/src/main/java/com/bateriaia/app/MovaDashboardView.java
          grep -q "buildCharge" voltai-build/src018/app/src/main/java/com/bateriaia/app/MovaDetailActivity.java
          grep -q "buildThermal" voltai-build/src018/app/src/main/java/com/bateriaia/app/MovaDetailActivity.java
          grep -q "buildNeural" voltai-build/src018/app/src/main/java/com/bateriaia/app/MovaDetailActivity.java
          grep -q "buildStandby" voltai-build/src018/app/src/main/java/com/bateriaia/app/MovaDetailActivity.java
          grep -q "buildSupervisor" voltai-build/src018/app/src/main/java/com/bateriaia/app/MovaDetailActivity.java
          grep -q "Central MOVA · Powered by MOVA" voltai-build/src018/app/src/main/res/layout/activity_main.xml
          ! grep -R "~" -n voltai-build/src018/app/src/main/java voltai-build/src018/app/src/main/res/layout voltai-build/src018/app/src/main/res/values

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build release APK
        working-directory: voltai-build/src018
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify unsigned release
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find voltai-build/src018/app/build/outputs/apk/release -name '*.apk' -print -quit)
          test -n "$APK"
          cp "$APK" voltai-build/VoltAI_0_18_USER_TEST_unsigned.apk
          unzip -t voltai-build/VoltAI_0_18_USER_TEST_unsigned.apk >/dev/null
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          "$AAPT" dump badging voltai-build/VoltAI_0_18_USER_TEST_unsigned.apk | tee voltai-build/badging018.txt
          grep -q "package: name='com.bateriaia.app' versionCode='46'" voltai-build/badging018.txt
          test -f voltai-build/src018/app/build/outputs/mapping/release/mapping.txt
          sha256sum voltai-build/VoltAI_0_18_USER_TEST_unsigned.apk > voltai-build/VoltAI_0_18_USER_TEST_unsigned.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: voltai-0-18-orbital-user-test
          path: |
            voltai-build/VoltAI_0_18_USER_TEST_unsigned.apk
            voltai-build/VoltAI_0_18_USER_TEST_unsigned.apk.sha256
            voltai-build/badging018.txt
            voltai-build/src018/app/build/outputs/mapping/release/mapping.txt
            /usr/local/lib/android/sdk/build-tools/36.0.0/zipalign
            /usr/local/lib/android/sdk/build-tools/36.0.0/apksigner
            /usr/local/lib/android/sdk/build-tools/36.0.0/lib/apksigner.jar
          if-no-files-found: error
