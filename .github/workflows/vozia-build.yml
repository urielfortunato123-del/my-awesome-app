name: Build Vozia APK

on:
  push:
    branches:
      - vozia-apk-build

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Reconstruct source
        shell: bash
        run: |
          cat vozia-ci/v011_1.b64 vozia-ci/v011_2.b64 vozia-ci/v011_3a.b64 vozia-ci/v011_3b.b64 | base64 -d > vozia-ci/source.zip
          unzip -q vozia-ci/source.zip -d vozia-ci/extracted
          unzip -t vozia-ci/source.zip
          mv vozia-ci/extracted/VoziaTranslate_v0.1.1 vozia-ci/extracted/VoziaTranslate_v0.1.2
          cd vozia-ci/extracted/VoziaTranslate_v0.1.2
          patch -p1 < "$GITHUB_WORKSPACE/vozia-ci/v012.patch"
          patch -p1 < "$GITHUB_WORKSPACE/vozia-ci/v013.patch"
          cd ..
          mv VoziaTranslate_v0.1.2 VoziaTranslate_v0.1.3
          cat "$GITHUB_WORKSPACE/vozia-ci/v014c_00.b64" "$GITHUB_WORKSPACE/vozia-ci/v014c_01.b64" "$GITHUB_WORKSPACE/vozia-ci/v014c_02.b64" "$GITHUB_WORKSPACE/vozia-ci/v014c_03.b64" "$GITHUB_WORKSPACE/vozia-ci/v014c_04.b64" "$GITHUB_WORKSPACE/vozia-ci/v014c_05.b64" "$GITHUB_WORKSPACE/vozia-ci/v014_03.b64" | base64 -d > "$GITHUB_WORKSPACE/vozia-ci/v014.patch"
          cd VoziaTranslate_v0.1.3
          patch -p1 < "$GITHUB_WORKSPACE/vozia-ci/v014.patch"
          cd ..
          mv VoziaTranslate_v0.1.3 VoziaTranslate_v0.1.4
          python3 - <<'PY'
          from pathlib import Path

          root = Path("VoziaTranslate_v0.1.4")
          service = root / "app/src/main/java/com/vozia/translate/TranslatorService.kt"
          text = service.read_text()

          old_field = "    private val translator = TranslationEngine()"
          new_field = "    private var translator: TranslationEngine? = null"
          if old_field not in text:
              raise SystemExit("translator field initializer not found")
          text = text.replace(old_field, new_field, 1)

          marker = '        Diagnostics.markStage(this, "translate_request")\n'
          if marker not in text:
              raise SystemExit("translate marker not found")
          prepare = '''        Diagnostics.markStage(this, "translate_engine_prepare")
          val engine = translator ?: runCatching {
              TranslationEngine()
          }.onFailure {
              Diagnostics.record(this, "translator_init_failure", it)
          }.getOrNull()?.also {
              translator = it
              Diagnostics.markStage(this, "translator_initialized")
          }

          if (engine == null) {
              if (!isPartial) publishStatus("Falha ao iniciar mecanismo de tradução")
              return
          }

          '''
          text = text.replace(marker, prepare + marker, 1)
          if "translator.translate(" not in text:
              raise SystemExit("translator.translate call not found")
          text = text.replace("translator.translate(", "engine.translate(", 1)

          old_close = '        runCatching { translator.close() }.onFailure { Diagnostics.record(this, "translator_close_failure", it) }'
          new_close = '''        runCatching { translator?.close() }.onFailure { Diagnostics.record(this, "translator_close_failure", it) }
          translator = null'''
          if old_close not in text:
              raise SystemExit("translator close block not found")
          text = text.replace(old_close, new_close, 1)

          service.write_text(text)

          engine_file = root / "app/src/main/java/com/vozia/translate/TranslationEngine.kt"
          e = engine_file.read_text()
          old_identifier = '    private val languageIdentifier = LanguageIdentification.getClient()'
          new_identifier = '''    private val languageIdentifierLazy = lazy(LazyThreadSafetyMode.SYNCHRONIZED) {
              LanguageIdentification.getClient()
          }
          private val languageIdentifier by languageIdentifierLazy'''
          if old_identifier not in e:
              raise SystemExit("languageIdentifier eager initializer not found")
          e = e.replace(old_identifier, new_identifier, 1)

          old_engine_close = '        languageIdentifier.close()'
          new_engine_close = '''        if (languageIdentifierLazy.isInitialized()) {
              languageIdentifier.close()
          }'''
          if old_engine_close not in e:
              raise SystemExit("languageIdentifier close not found")
          e = e.replace(old_engine_close, new_engine_close, 1)
          engine_file.write_text(e)

          gradle = root / "app/build.gradle.kts"
          g = gradle.read_text()
          g = g.replace('versionCode = 5', 'versionCode = 6')
          g = g.replace('versionName = "0.1.4"', 'versionName = "0.1.5"')
          gradle.write_text(g)

          layout = root / "app/src/main/res/layout/activity_main.xml"
          x = layout.read_text().replace('v0.1.4 • diagnóstico de sistema', 'v0.1.5 • correção do crash do serviço')
          layout.write_text(x)
          PY
          mv VoziaTranslate_v0.1.4 VoziaTranslate_v0.1.5
          python3 - <<'PY'
          from pathlib import Path

          root = Path("VoziaTranslate_v0.1.5")

          # v0.1.6: manter o serviço vivo ao sair da tela e registrar o motivo real de qualquer parada.
          manifest = root / "app/src/main/AndroidManifest.xml"
          m = manifest.read_text()
          manifest_anchor = '            android:exported="false"\n            android:foregroundServiceType="mediaProjection|microphone" />'
          manifest_replacement = '            android:exported="false"\n            android:stopWithTask="false"\n            android:foregroundServiceType="mediaProjection|microphone" />'
          if manifest_anchor not in m:
              raise SystemExit("service manifest attributes not found")
          m = m.replace(manifest_anchor, manifest_replacement, 1)
          manifest.write_text(m)

          diag = root / "app/src/main/java/com/vozia/translate/Diagnostics.kt"
          d = diag.read_text()

          if 'private const val KEY_STOP_REASON' not in d:
              d = d.replace(
                  '    private const val KEY_CLEAN_STOP = "clean_stop"\n',
                  '    private const val KEY_CLEAN_STOP = "clean_stop"\n    private const val KEY_STOP_REASON = "stop_reason"\n',
                  1
              )

          # Limpa o motivo antigo ao iniciar uma nova sessão.
          reset_anchor = '.remove(KEY_CRASH_TIME)'
          if reset_anchor not in d:
              raise SystemExit("diagnostics crash-time reset anchor not found")
          d = d.replace(
              reset_anchor,
              reset_anchor + '\n                .remove(KEY_STOP_REASON)',
              1
          )

          # Novo encerramento: não sobrescreve a última etapa útil da sessão.
          insert_before_record = '    fun record(context: Context, label: String, error: Throwable) {'
          mark_stop = '''    fun markStop(context: Context, reason: String, clean: Boolean) {
              val p = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
              val id = p.getString(KEY_SESSION_ID, "-") ?: "-"
              val mode = p.getString(KEY_TEST_MODE, "-") ?: "-"
              val stage = p.getString(KEY_STAGE, "unknown") ?: "unknown"
              p.edit()
                  .putString(KEY_STOP_REASON, reason)
                  .putBoolean(KEY_CLEAN_STOP, clean)
                  .commit()
              updateProcessSummary(context, id, mode, "$stage|stop=$reason")
              Log.i("VoziaDiag", "session=$id stop=$reason clean=$clean lastStage=$stage")
          }

          '''
          if insert_before_record not in d:
              raise SystemExit("diagnostics record anchor not found")
          if 'fun markStop(context: Context' not in d:
              d = d.replace(insert_before_record, mark_stop + insert_before_record, 1)

          # Acrescenta o motivo de parada ao relatório.
          report_anchor = 'append("Encerramento limpo: ").append(clean).append(\'\\n\')'
          if report_anchor not in d:
              raise SystemExit("diagnostics report clean anchor not found")
          d = d.replace(
              report_anchor,
              report_anchor + '\n            val stopReason = p.getString(KEY_STOP_REASON, null)\n            append("Motivo da parada: ").append(stopReason ?: "nenhum registrado").append(\'\\n\')',
              1
          )
          diag.write_text(d)

          service = root / "app/src/main/java/com/vozia/translate/TranslatorService.kt"
          t = service.read_text()

          # Diferencia parada solicitada pelo usuário.
          t = t.replace('''            ACTION_STOP -> {
                  stopEverything()
                  return START_NOT_STICKY
              }''',
              '''            ACTION_STOP -> {
                  stopEverything("user_stop", true)
                  return START_NOT_STICKY
              }''', 1)

          # MediaProjection encerrada: registra explicitamente o motivo.
          t = t.replace(
              '''                    publishStatus("Captura encerrada pelo Android")
                      stopEverything()''',
              '''                    Diagnostics.markStage(this@TranslatorService, "media_projection_onStop")
                      publishStatus("Captura encerrada pelo Android")
                      stopEverything("media_projection_onStop", true)''',
              1
          )

          # Assinatura da rotina de encerramento com motivo.
          if '    private fun stopEverything() {' not in t:
              raise SystemExit("stopEverything signature not found")
          t = t.replace(
              '    private fun stopEverything() {',
              '    private fun stopEverything(reason: String = "internal_stop", clean: Boolean = true) {',
              1
          )

          # Não sobrescreve mais a última etapa útil com stopped_cleanly.
          if '        Diagnostics.cleanStop(this)' not in t:
              raise SystemExit("Diagnostics.cleanStop call not found")
          t = t.replace(
              '        Diagnostics.cleanStop(this)',
              '        Diagnostics.markStop(this, reason, clean)',
              1
          )

          # Se o Android destruir o serviço sem termos pedido, registra como parada externa.
          new_destroy = '''    override fun onDestroy() {
              if (!stopping.get()) {
                  Diagnostics.markStage(this, "service_onDestroy_external")
                  stopEverything("service_onDestroy_external", false)
              }
              super.onDestroy()
          }

          override fun onTaskRemoved(rootIntent: Intent?) {
              // Sair da tela/retirar a tarefa não deve encerrar a tradução.
              Diagnostics.markStage(this, "task_removed_service_kept_alive")
              super.onTaskRemoved(rootIntent)
          }'''
          destroy_start = t.find('    override fun onDestroy() {')
          destroy_end = t.find('\n\n    override fun onReadyForSpeech', destroy_start)
          if destroy_start < 0 or destroy_end < 0:
              raise SystemExit("onDestroy region not found")
          t = t[:destroy_start] + new_destroy + t[destroy_end:]

          # Mantém a ação PARAR também quando a notificação é atualizada por status.
          new_publish = '''    private fun publishStatus(text: String) {
              if (outputMode != MODE_AUDIO) updateOverlay(text)

              val manager = getSystemService(NotificationManager::class.java)
              val stopIntent = Intent(this, TranslatorService::class.java).apply { action = ACTION_STOP }
              val stopPending = PendingIntent.getService(
                  this,
                  7,
                  stopIntent,
                  PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
              )
              val openIntent = Intent(this, MainActivity::class.java)
              val openPending = PendingIntent.getActivity(
                  this,
                  8,
                  openIntent,
                  PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
              )
              val notification = NotificationCompat.Builder(this, CHANNEL_ID)
                  .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                  .setContentTitle("Vozia Translate ativo")
                  .setContentText(text.take(100))
                  .setContentIntent(openPending)
                  .setOngoing(true)
                  .setOnlyAlertOnce(true)
                  .addAction(0, "Parar", stopPending)
                  .build()
              runCatching { manager.notify(NOTIFICATION_ID, notification) }
          }'''
          publish_start = t.find('    private fun publishStatus(text: String) {')
          publish_end = t.find('\n\n    private fun stopEverything', publish_start)
          if publish_start < 0 or publish_end < 0:
              raise SystemExit("publishStatus region not found")
          t = t[:publish_start] + new_publish + t[publish_end:]
          service.write_text(t)

          gradle = root / "app/build.gradle.kts"
          g = gradle.read_text()
          g = g.replace('versionCode = 6', 'versionCode = 7')
          g = g.replace('versionName = "0.1.5"', 'versionName = "0.1.6"')
          gradle.write_text(g)

          layout = root / "app/src/main/res/layout/activity_main.xml"
          x = layout.read_text().replace(
              'v0.1.5 • correção do crash do serviço',
              'v0.1.6 • serviço em segundo plano'
          )
          layout.write_text(x)
          PY
          mv VoziaTranslate_v0.1.5 VoziaTranslate_v0.1.6
          python3 "$GITHUB_WORKSPACE/vozia-ci/v017.py" "$GITHUB_WORKSPACE/vozia-ci/extracted/VoziaTranslate_v0.1.6"
          mv VoziaTranslate_v0.1.6 VoziaTranslate_v0.1.7
          python3 "$GITHUB_WORKSPACE/vozia-ci/v018.py" "$GITHUB_WORKSPACE/vozia-ci/extracted/VoziaTranslate_v0.1.7"
          mv VoziaTranslate_v0.1.7 VoziaTranslate_v0.1.8

      - name: Expose preinstalled Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        shell: bash
        working-directory: vozia-ci/extracted/VoziaTranslate_v0.1.8
        run: |
          sed -i 's/compileSdk = 37/compileSdk = 36/' app/build.gradle.kts
          sed -i '/org.jetbrains.kotlin.android/d' build.gradle.kts app/build.gradle.kts
          sed -i '/^[[:space:]]*kotlinOptions[[:space:]]*{/,/^[[:space:]]*}/d' app/build.gradle.kts
          sed -i 's/import com.google.mlkit.nl.translate.DownloadConditions/import com.google.mlkit.common.model.DownloadConditions/' app/src/main/java/com/vozia/translate/TranslationEngine.kt
          gradle --no-daemon --stacktrace :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/VoziaTranslate_v0.1.8-debug.apk"

      - name: Build release unsigned APK
        shell: bash
        working-directory: vozia-ci/extracted/VoziaTranslate_v0.1.8
        run: |
          gradle --no-daemon --stacktrace :app:assembleRelease
          cp app/build/outputs/apk/release/app-release-unsigned.apk "$GITHUB_WORKSPACE/VoziaTranslate_v0.1.8-release-unsigned.apk"

      - name: Package Android signing tools
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/android-signing-tools/lib" "$GITHUB_WORKSPACE/android-signing-tools/lib64"
          cp /usr/local/lib/android/sdk/build-tools/36.0.0/apksigner "$GITHUB_WORKSPACE/android-signing-tools/"
          cp /usr/local/lib/android/sdk/build-tools/36.0.0/zipalign "$GITHUB_WORKSPACE/android-signing-tools/"
          cp /usr/local/lib/android/sdk/build-tools/36.0.0/lib/apksigner.jar "$GITHUB_WORKSPACE/android-signing-tools/lib/"
          cp /usr/local/lib/android/sdk/build-tools/36.0.0/lib64/libc++.so "$GITHUB_WORKSPACE/android-signing-tools/lib64/"
          chmod +x "$GITHUB_WORKSPACE/android-signing-tools/apksigner" "$GITHUB_WORKSPACE/android-signing-tools/zipalign"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VoziaTranslate-v0.1.8-debug
          path: VoziaTranslate_v0.1.8-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: VoziaTranslate-v0.1.8-release-unsigned
          path: VoziaTranslate_v0.1.8-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools-36
          path: android-signing-tools
          if-no-files-found: error
          retention-days: 7
