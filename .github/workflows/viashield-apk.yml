name: Build ViaShield DNS APK

on:
  push:
    branches:
      - build-viashield-dns
    paths:
      - 'viashield_android/**'
      - '.github/workflows/viashield-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK packages
        shell: bash
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        working-directory: viashield_android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          test -f viashield_android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh viashield_android/app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: cp viashield_android/app/build/outputs/apk/debug/app-debug.apk ViaShield_DNS_v0.1.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ViaShield_DNS_v0.1.1
          path: ViaShield_DNS_v0.1.1.apk
          if-no-files-found: error
          retention-days: 14
