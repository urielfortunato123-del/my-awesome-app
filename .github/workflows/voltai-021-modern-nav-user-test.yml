name: Build VoltAI 0.21 Modern Nav User Test

on:
  push:
    branches:
      - voltai-021-modern-nav-user-test
    paths:
      - '.github/workflows/voltai-021-modern-nav-user-test.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore VoltAI 0.20 source
        shell: bash
        run: |
          set -euo pipefail
          cat voltai-build/volt20_* > voltai-build/VoltAI_0_20_source.b64
          base64 -d voltai-build/VoltAI_0_20_source.b64 > voltai-build/VoltAI_0_20_source.tar.xz
          echo "5446ff6a94917dfec3266b5030a7117b2beaa49594841825b10142d9135d7f46  voltai-build/VoltAI_0_20_source.tar.xz" | sha256sum -c -
          mkdir -p voltai-build/src021
          tar -xJf voltai-build/VoltAI_0_20_source.tar.xz -C voltai-build/src021

      - name: Apply VoltAI 0.21 modern bottom navigation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('voltai-build/src021')

          p = root / 'app/build.gradle'
          s = p.read_text(encoding='utf-8')
          s = s.replace('versionCode 48', 'versionCode 49')
          s = s.replace("versionName '0.20.0-voltai-ui-polish-adaptive-user-test-universal'", "versionName '0.21.0-voltai-modern-nav-user-test-universal'")
          p.write_text(s, encoding='utf-8')

          p = root / 'app/src/main/res/layout/activity_main.xml'
          s = p.read_text(encoding='utf-8')
          start = s.index('    <LinearLayout android:id="@+id/bottomNav"')
          end = s.index('    </LinearLayout>\n</LinearLayout>', start) + len('    </LinearLayout>')
          nav = '''    <LinearLayout
              android:id="@+id/bottomNav"
              android:layout_width="match_parent"
              android:layout_height="78dp"
              android:layout_marginLeft="14dp"
              android:layout_marginRight="14dp"
              android:layout_marginBottom="8dp"
              android:background="@drawable/bg_nav"
              android:gravity="center"
              android:orientation="horizontal"
              android:paddingLeft="6dp"
              android:paddingTop="6dp"
              android:paddingRight="6dp"
              android:paddingBottom="6dp">

              <TextView
                  android:id="@+id/tabHome"
                  android:layout_width="0dp"
                  android:layout_height="match_parent"
                  android:layout_weight="1"
                  android:background="@drawable/bg_nav_selected"
                  android:drawableTop="@drawable/ic_nav_home_modern"
                  android:drawablePadding="4dp"
                  android:fontFamily="sans-serif-medium"
                  android:gravity="center"
                  android:includeFontPadding="false"
                  android:maxLines="1"
                  android:text="Início"
                  android:textColor="@color/nav_active"
                  android:textSize="10sp" />

              <TextView
                  android:id="@+id/tabAi"
                  android:layout_width="0dp"
                  android:layout_height="match_parent"
                  android:layout_marginLeft="3dp"
                  android:layout_weight="1"
                  android:background="@drawable/bg_nav_unselected"
                  android:drawableTop="@drawable/ic_nav_consumo_modern"
                  android:drawablePadding="4dp"
                  android:fontFamily="sans-serif-medium"
                  android:gravity="center"
                  android:includeFontPadding="false"
                  android:maxLines="1"
                  android:text="Consumo"
                  android:textColor="@color/text_secondary"
                  android:textSize="10sp" />

              <TextView
                  android:id="@+id/tabMova"
                  android:layout_width="0dp"
                  android:layout_height="match_parent"
                  android:layout_marginLeft="3dp"
                  android:layout_weight="1"
                  android:background="@drawable/bg_nav_unselected"
                  android:drawableTop="@drawable/ic_nav_mova_modern"
                  android:drawablePadding="4dp"
                  android:fontFamily="sans-serif-medium"
                  android:gravity="center"
                  android:includeFontPadding="false"
                  android:maxLines="1"
                  android:text="MOVA"
                  android:textColor="@color/text_secondary"
                  android:textSize="10sp" />

              <TextView
                  android:id="@+id/tabAnalysis"
                  android:layout_width="0dp"
                  android:layout_height="match_parent"
                  android:layout_marginLeft="3dp"
                  android:layout_weight="1"
                  android:background="@drawable/bg_nav_unselected"
                  android:drawableTop="@drawable/ic_nav_charge_modern"
                  android:drawablePadding="4dp"
                  android:fontFamily="sans-serif-medium"
                  android:gravity="center"
                  android:includeFontPadding="false"
                  android:maxLines="1"
                  android:text="Recarga"
                  android:textColor="@color/text_secondary"
                  android:textSize="10sp" />

              <TextView
                  android:id="@+id/tabSettings"
                  android:layout_width="0dp"
                  android:layout_height="match_parent"
                  android:layout_marginLeft="3dp"
                  android:layout_weight="1"
                  android:background="@drawable/bg_nav_unselected"
                  android:drawableTop="@drawable/ic_nav_more_modern"
                  android:drawablePadding="4dp"
                  android:fontFamily="sans-serif-medium"
                  android:gravity="center"
                  android:includeFontPadding="false"
                  android:maxLines="1"
                  android:text="Mais"
                  android:textColor="@color/text_secondary"
                  android:textSize="10sp" />
          </LinearLayout>'''
          s = s[:start] + nav + s[end:]
          p.write_text(s, encoding='utf-8')

          draw = root / 'app/src/main/res/drawable'
          vectors = {
            'ic_nav_home_modern.xml': '''<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="22dp" android:height="22dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF" android:pathData="M12,3.2L3.4,10.1v9.4c0,0.8 0.7,1.5 1.5,1.5h4.9v-6.1h4.4V21h4.9c0.8,0 1.5,-0.7 1.5,-1.5v-9.4L12,3.2zM18.6,19h-2.4v-6.1H7.8V19H5.4v-7.9L12,5.8l6.6,5.3V19z"/>
          </vector>''',
            'ic_nav_consumo_modern.xml': '''<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="22dp" android:height="22dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF" android:pathData="M4,20h3V10H4v10zM10.5,20h3V4h-3v16zM17,20h3v-7h-3v7z"/>
          </vector>''',
            'ic_nav_mova_modern.xml': '''<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="22dp" android:height="22dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF" android:pathData="M12,2.7c0.6,4.8 2.5,6.7 7.3,7.3c-4.8,0.6 -6.7,2.5 -7.3,7.3c-0.6,-4.8 -2.5,-6.7 -7.3,-7.3c4.8,-0.6 6.7,-2.5 7.3,-7.3zM18.7,15.2c0.3,2.2 1.2,3.1 3.4,3.4c-2.2,0.3 -3.1,1.2 -3.4,3.4c-0.3,-2.2 -1.2,-3.1 -3.4,-3.4c2.2,-0.3 3.1,-1.2 3.4,-3.4z"/>
          </vector>''',
            'ic_nav_charge_modern.xml': '''<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="22dp" android:height="22dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF" android:pathData="M13.3,2L5.6,13.1h5.1L9.8,22l8.6,-12.2h-5.2L13.3,2z"/>
          </vector>''',
            'ic_nav_more_modern.xml': '''<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="22dp" android:height="22dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF" android:pathData="M5,6.5h14c0.7,0 1.2,0.5 1.2,1.2S19.7,9 19,9H5C4.3,9 3.8,8.4 3.8,7.7S4.3,6.5 5,6.5zM5,10.8h14c0.7,0 1.2,0.5 1.2,1.2s-0.5,1.2 -1.2,1.2H5c-0.7,0 -1.2,-0.5 -1.2,-1.2s0.5,-1.2 1.2,-1.2zM5,15h14c0.7,0 1.2,0.5 1.2,1.2s-0.5,1.2 -1.2,1.2H5c-0.7,0 -1.2,-0.5 -1.2,-1.2S4.3,15 5,15z"/>
          </vector>'''
          }
          for name, data in vectors.items():
              (draw / name).write_text(data, encoding='utf-8')

          (draw / 'bg_nav.xml').write_text('''<layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item><shape android:shape="rectangle"><gradient android:angle="315" android:startColor="#F2162232" android:centerColor="#F00D1724" android:endColor="#F008111D"/><corners android:radius="31dp"/><stroke android:width="1dp" android:color="#7A4C6B86"/><padding android:left="1dp" android:top="1dp" android:right="1dp" android:bottom="1dp"/></shape></item>
              <item android:left="2dp" android:top="2dp" android:right="2dp" android:bottom="24dp"><shape android:shape="rectangle"><gradient android:angle="270" android:startColor="#2EFFFFFF" android:endColor="#00FFFFFF"/><corners android:radius="29dp"/></shape></item>
          </layer-list>''', encoding='utf-8')
          (draw / 'bg_nav_selected.xml').write_text('''<layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item><shape android:shape="rectangle"><gradient android:angle="315" android:startColor="#0BE079" android:centerColor="#08C96E" android:endColor="#03B765"/><corners android:radius="23dp"/><stroke android:width="1dp" android:color="#5CFFC0"/></shape></item>
              <item android:left="1dp" android:top="1dp" android:right="1dp" android:bottom="24dp"><shape android:shape="rectangle"><gradient android:angle="270" android:startColor="#3DFFFFFF" android:endColor="#00FFFFFF"/><corners android:radius="22dp"/></shape></item>
          </layer-list>''', encoding='utf-8')
          (draw / 'bg_nav_unselected.xml').write_text('''<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><solid android:color="#0011171F"/><corners android:radius="23dp"/></shape>''', encoding='utf-8')

          p = root / 'app/src/main/java/com/bateriaia/app/MainActivity.java'
          s = p.read_text(encoding='utf-8')
          if 'import android.content.res.ColorStateList;' not in s:
              s = s.replace('import android.content.pm.PackageManager;\n', 'import android.content.pm.PackageManager;\nimport android.content.res.ColorStateList;\n')
          old = '''        int active = Color.parseColor("#07100D");
              int idle = Color.parseColor("#8D9AAD");
              tabHome.setTextColor(tab == 0 ? active : idle);
              tabAi.setTextColor(tab == 1 ? active : idle);
              tabAnalysis.setTextColor(tab == 2 ? active : idle);
              tabSettings.setTextColor(tab == 3 ? active : idle);
              tabMova.setTextColor(tab == 4 ? active : idle);
              tabHome.setBackgroundResource(tab == 0 ? R.drawable.bg_nav_selected : R.drawable.bg_nav_unselected);
              tabAi.setBackgroundResource(tab == 1 ? R.drawable.bg_nav_selected : R.drawable.bg_nav_unselected);
              tabAnalysis.setBackgroundResource(tab == 2 ? R.drawable.bg_nav_selected : R.drawable.bg_nav_unselected);
              tabSettings.setBackgroundResource(tab == 3 ? R.drawable.bg_nav_selected : R.drawable.bg_nav_unselected);
              tabMova.setBackgroundResource(tab == 4 ? R.drawable.bg_nav_selected : R.drawable.bg_nav_unselected);'''
          new = '''        updateNavItem(tabHome, tab == 0);
              updateNavItem(tabAi, tab == 1);
              updateNavItem(tabAnalysis, tab == 2);
              updateNavItem(tabSettings, tab == 3);
              updateNavItem(tabMova, tab == 4);'''
          if old not in s:
              raise SystemExit('showTab navigation block not found')
          s = s.replace(old, new)
          marker = '''    private void showConsumptionPanel(int panel) {'''
          helper = '''    private void updateNavItem(TextView view, boolean selected) {
              int active = Color.parseColor("#06110D");
              int idle = Color.parseColor("#93A5BB");
              int activeIcon = Color.parseColor("#06110D");
              int idleIcon = Color.parseColor("#A8B8CD");
              view.setBackgroundResource(selected ? R.drawable.bg_nav_selected : R.drawable.bg_nav_unselected);
              view.setTextColor(selected ? active : idle);
              view.setCompoundDrawableTintList(ColorStateList.valueOf(selected ? activeIcon : idleIcon));
              view.setAlpha(selected ? 1.0f : 0.86f);
              view.setScaleX(selected ? 1.0f : 0.98f);
              view.setScaleY(selected ? 1.0f : 0.98f);
              view.setTranslationY(selected ? -1.0f : 0.0f);
          }

          '''
          s = s.replace(marker, helper + marker)
          p.write_text(s, encoding='utf-8')

          (root / 'RELEASE_NOTES_MV0_21.md').write_text('''# VoltAI 0.21 USER TEST — Modern Bottom Navigation

- versionCode 49
- versionName 0.21.0-voltai-modern-nav-user-test-universal
- substitui glifos Unicode da barra inferior por ícones vetoriais consistentes
- dock inferior com acabamento mais moderno e proporções refinadas
- item ativo em pill verde com ícone e texto tonalizados em conjunto
- itens inativos com escala, opacidade e contraste mais discretos
- preservados package com.bateriaia.app, lógica MOVA, cálculos, sincronização e restante da interface 0.20
''', encoding='utf-8')
          PY

      - name: Preflight modern navigation
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionCode 49" voltai-build/src021/app/build.gradle
          grep -q "0.21.0-voltai-modern-nav-user-test-universal" voltai-build/src021/app/build.gradle
          grep -q 'drawableTop="@drawable/ic_nav_home_modern"' voltai-build/src021/app/src/main/res/layout/activity_main.xml
          grep -q 'drawableTop="@drawable/ic_nav_consumo_modern"' voltai-build/src021/app/src/main/res/layout/activity_main.xml
          grep -q 'drawableTop="@drawable/ic_nav_mova_modern"' voltai-build/src021/app/src/main/res/layout/activity_main.xml
          grep -q 'drawableTop="@drawable/ic_nav_charge_modern"' voltai-build/src021/app/src/main/res/layout/activity_main.xml
          grep -q 'drawableTop="@drawable/ic_nav_more_modern"' voltai-build/src021/app/src/main/res/layout/activity_main.xml
          grep -q 'setCompoundDrawableTintList' voltai-build/src021/app/src/main/java/com/bateriaia/app/MainActivity.java
          ! grep -q '⌂\|◉\|✦\|☰' voltai-build/src021/app/src/main/res/layout/activity_main.xml
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for p in Path('voltai-build/src021/app/src/main/res').rglob('*.xml'):
              ET.parse(p)
          print('XML validation: OK')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build release APK
        working-directory: voltai-build/src021
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify and package release
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find voltai-build/src021/app/build/outputs/apk/release -name '*.apk' -print -quit)
          test -n "$APK"
          cp "$APK" voltai-build/VoltAI_0_21_USER_TEST_unsigned.apk
          unzip -t voltai-build/VoltAI_0_21_USER_TEST_unsigned.apk >/dev/null
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          "$AAPT" dump badging voltai-build/VoltAI_0_21_USER_TEST_unsigned.apk | tee voltai-build/badging021.txt
          grep -q "package: name='com.bateriaia.app' versionCode='49'" voltai-build/badging021.txt
          test -f voltai-build/src021/app/build/outputs/mapping/release/mapping.txt
          (cd voltai-build/src021 && zip -qr ../VoltAI_0_21_USER_TEST_source.zip . -x 'app/build/*' '.gradle/*')
          sha256sum voltai-build/VoltAI_0_21_USER_TEST_unsigned.apk > voltai-build/VoltAI_0_21_USER_TEST_unsigned.apk.sha256
          sha256sum voltai-build/VoltAI_0_21_USER_TEST_source.zip > voltai-build/VoltAI_0_21_USER_TEST_source.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: voltai-0-21-modern-nav-user-test
          path: |
            voltai-build/VoltAI_0_21_USER_TEST_unsigned.apk
            voltai-build/VoltAI_0_21_USER_TEST_unsigned.apk.sha256
            voltai-build/VoltAI_0_21_USER_TEST_source.zip
            voltai-build/VoltAI_0_21_USER_TEST_source.zip.sha256
            voltai-build/src021/RELEASE_NOTES_MV0_21.md
            voltai-build/badging021.txt
            voltai-build/src021/app/build/outputs/mapping/release/mapping.txt
            /usr/local/lib/android/sdk/build-tools/36.0.0/aapt2
            /usr/local/lib/android/sdk/build-tools/36.0.0/zipalign
            /usr/local/lib/android/sdk/build-tools/36.0.0/apksigner
            /usr/local/lib/android/sdk/build-tools/36.0.0/lib/apksigner.jar
          if-no-files-found: error
