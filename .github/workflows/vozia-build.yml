name: Build Vozia APK

on:
  push:
    branches:
      - vozia-apk-build

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Reconstruct source
        shell: bash
        run: |
          cat vozia-ci/chunk1.b64 vozia-ci/chunk2.b64 vozia-ci/chunk3.b64 vozia-ci/chunk4.b64 | base64 -d > vozia-ci/source.zip
          unzip -q vozia-ci/source.zip -d vozia-ci/extracted
          unzip -t vozia-ci/source.zip

      - name: Install Android SDK 37
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;37.0.0"

      - name: Build debug APK
        shell: bash
        working-directory: vozia-ci/extracted/VoziaTranslate_v0.1.0
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/VoziaTranslate_v0.1.0-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoziaTranslate-v0.1.0-debug
          path: VoziaTranslate_v0.1.0-debug.apk
          if-no-files-found: error
          retention-days: 7
