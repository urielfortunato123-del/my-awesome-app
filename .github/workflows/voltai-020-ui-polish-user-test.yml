name: Build VoltAI 0.20 UI Polish User Test

on:
  push:
    branches:
      - voltai-020-ui-polish-user-test
    paths:
      - 'voltai-build/volt20_*'
      - '.github/workflows/voltai-020-ui-polish-user-test.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore VoltAI 0.20 source
        shell: bash
        run: |
          set -euo pipefail
          cat voltai-build/volt20_* > voltai-build/VoltAI_0_20_source.b64
          base64 -d voltai-build/VoltAI_0_20_source.b64 > voltai-build/VoltAI_0_20_source.tar.xz
          echo "5446ff6a94917dfec3266b5030a7117b2beaa49594841825b10142d9135d7f46  voltai-build/VoltAI_0_20_source.tar.xz" | sha256sum -c -
          mkdir -p voltai-build/src020
          tar -xJf voltai-build/VoltAI_0_20_source.tar.xz -C voltai-build/src020

      - name: Preflight UI polish
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionCode 48" voltai-build/src020/app/build.gradle
          grep -q "0.20.0-voltai-ui-polish-adaptive-user-test-universal" voltai-build/src020/app/build.gradle
          grep -q 'android:layout_marginTop="18dp"' voltai-build/src020/app/src/main/res/layout/activity_main.xml
          grep -q 'android:layout_width="232dp" android:layout_height="232dp"' voltai-build/src020/app/src/main/res/layout/activity_main.xml
          grep -q 'c.drawCircle(cx,cy,orbitR,p)' voltai-build/src020/app/src/main/java/com/bateriaia/app/MovaDashboardView.java
          grep -q 'fittedLabel(c,title' voltai-build/src020/app/src/main/java/com/bateriaia/app/MovaDashboardView.java
          grep -q 'setMeasuredDimension(size, size)' voltai-build/src020/app/src/main/java/com/bateriaia/app/BatteryGaugeView.java
          ! grep -R "~" -n voltai-build/src020/app/src/main/java voltai-build/src020/app/src/main/res/layout voltai-build/src020/app/src/main/res/values

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build release APK
        working-directory: voltai-build/src020
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify unsigned release
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find voltai-build/src020/app/build/outputs/apk/release -name '*.apk' -print -quit)
          test -n "$APK"
          cp "$APK" voltai-build/VoltAI_0_20_USER_TEST_unsigned.apk
          unzip -t voltai-build/VoltAI_0_20_USER_TEST_unsigned.apk >/dev/null
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          "$AAPT" dump badging voltai-build/VoltAI_0_20_USER_TEST_unsigned.apk | tee voltai-build/badging020.txt
          grep -q "package: name='com.bateriaia.app' versionCode='48'" voltai-build/badging020.txt
          test -f voltai-build/src020/app/build/outputs/mapping/release/mapping.txt
          sha256sum voltai-build/VoltAI_0_20_USER_TEST_unsigned.apk > voltai-build/VoltAI_0_20_USER_TEST_unsigned.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: voltai-0-20-ui-polish-user-test
          path: |
            voltai-build/VoltAI_0_20_USER_TEST_unsigned.apk
            voltai-build/VoltAI_0_20_USER_TEST_unsigned.apk.sha256
            voltai-build/badging020.txt
            voltai-build/src020/app/build/outputs/mapping/release/mapping.txt
            /usr/local/lib/android/sdk/build-tools/36.0.0/zipalign
            /usr/local/lib/android/sdk/build-tools/36.0.0/apksigner
            /usr/local/lib/android/sdk/build-tools/36.0.0/lib/apksigner.jar
          if-no-files-found: error
